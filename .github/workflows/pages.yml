name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'loading-page/**'
      - 'scripts/build-pages.py'
      - 'scripts/setup-live2d-runtime.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project
        run: python scripts/check-project.py
      - name: Package static preview and verified Live2D runtime
        run: python scripts/build-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
